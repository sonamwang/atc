name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
      - run: gofmt -d $(find . -name '*.go') | (! grep .)
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/atc-server ./cmd/atc-agent ./cmd/atc
