name: Security

on:
  pull_request:
  push:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # govulncheck@latest currently requires Go 1.26; project builds run
          # separately in CI on the minimum supported Go version.
          go-version: "1.26.x"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
